services:
  - type: web
    name: msol-skilling-ledger
    runtime: node
    region: singapore   # closest to Maharashtra; change to ohio/frankfurt as needed
    plan: free          # upgrade to starter/standard for production
    branch: main

    buildCommand: >
      npm ci &&
      npm run build &&
      mkdir -p .next/standalone/.next &&
      cp -r .next/static .next/standalone/.next/static &&
      cp -r public .next/standalone/public

    startCommand: node server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      # PORT is injected automatically by Render at runtime — do NOT hardcode it here.
      # NODE_OPTIONS: cap heap to stay within Render free tier's 512 MB RAM limit.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"

    healthCheckPath: /api/health
    autoDeploy: true
