services:
  - type: web
    name: msol-skilling-ledger
    runtime: node
    region: singapore   # closest to Maharashtra; change to ohio/frankfurt as needed
    plan: free          # upgrade to starter/standard for production
    branch: main

    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      # Add real secrets here, e.g.:
      # - key: NEXT_PUBLIC_API_URL
      #   value: https://api.example.com

    healthCheckPath: /
    autoDeploy: true
